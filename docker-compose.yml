name: robotic-assist-child

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      LOG_LEVEL: INFO
      PROMPTS_REPOSITORY_PATH: /app/prompts
      POSTGRES_DSN: postgresql+psycopg://rac:rac@postgres:5432/rac
      MONGODB_URI: mongodb://mongodb:27017/rac
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      # Prompts repository mounted read-only from the sibling repo.
      - ../robotic-assist-child-prompts:/app/prompts:ro
    expose:
      - "8000"
    ports:
      # Internal port exposed for development; clients should prefer the gateway.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rac
      POSTGRES_PASSWORD: rac
      POSTGRES_DB: rac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rac -d rac"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
