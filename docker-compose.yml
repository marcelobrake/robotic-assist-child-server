name: robotic-assist-child

services:
  server:
    image: robotic-assist-child-server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      LOG_LEVEL: INFO
      PROMPTS_REPOSITORY_PATH: /app/prompts
      # Local dev convenience; override / set false for production-like envs.
      DEV_AUTH_DISABLED: "true"
      JWT_SECRET: dev-insecure-secret-change-me
      POSTGRES_DSN: postgresql+psycopg://rac:rac@postgres:5432/rac
      MONGODB_URI: mongodb://mongodb:27017/rac
      MONGODB_DATABASE: rac
      CONVERSATION_PROVIDER: ${CONVERSATION_PROVIDER:-fake}
      CONVERSATION_TEMPERATURE: ${CONVERSATION_TEMPERATURE:-0.4}
      CONVERSATION_MAX_TOKENS: ${CONVERSATION_MAX_TOKENS:-700}
      CONVERSATION_TIMEOUT_SECONDS: ${CONVERSATION_TIMEOUT_SECONDS:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-openai/gpt-5.4-nano}
      OPENROUTER_CHAT_MODEL_FALLBACK: ${OPENROUTER_CHAT_MODEL_FALLBACK:-openai/gpt-5.4-mini}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:8080}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Robotic Assist Child}
      OPENROUTER_FALLBACK_TO_FAKE: ${OPENROUTER_FALLBACK_TO_FAKE:-true}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-fake}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-google/gemini-3.1-flash-image-preview}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/app/data/images}
      PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-http://localhost:8080/v1/images}
      IMAGE_OUTPUT_FORMAT: ${IMAGE_OUTPUT_FORMAT:-png}
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-60}
      IMAGE_MAX_RETRIES: ${IMAGE_MAX_RETRIES:-1}
      IMAGE_FALLBACK_TO_FAKE: ${IMAGE_FALLBACK_TO_FAKE:-true}
      IMAGE_DEFAULT_ASPECT_RATIO: ${IMAGE_DEFAULT_ASPECT_RATIO:-1:1}
      IMAGE_DEFAULT_SIZE: ${IMAGE_DEFAULT_SIZE:-800x800}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_OUTPUT_FORMAT: ${TTS_OUTPUT_FORMAT:-mp3_44100_128}
      TTS_STORAGE_PATH: ${TTS_STORAGE_PATH:-/app/data/audio}
      PUBLIC_AUDIO_BASE_URL: ${PUBLIC_AUDIO_BASE_URL:-http://localhost:8080/v1/audio}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_TTS_TIMEOUT_SECONDS: ${ELEVENLABS_TTS_TIMEOUT_SECONDS:-30}
      ELEVENLABS_TTS_MAX_RETRIES: ${ELEVENLABS_TTS_MAX_RETRIES:-2}
      STT_PROVIDER: ${STT_PROVIDER:-elevenlabs}
      STT_ENABLED: ${STT_ENABLED:-false}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
      ELEVENLABS_STT_REALTIME_MODEL: ${ELEVENLABS_STT_REALTIME_MODEL:-scribe_v2_realtime}
      ELEVENLABS_STT_TIMEOUT_SECONDS: ${ELEVENLABS_STT_TIMEOUT_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STT_BASE_URL: ${OPENAI_STT_BASE_URL:-https://api.openai.com/v1}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_STT_TIMEOUT_SECONDS: ${OPENAI_STT_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      # Prompts repository mounted read-only from the sibling repo.
      - ../robotic-assist-child-prompts:/app/prompts:ro
      # Local generated images, temporary until S3/CloudFront is implemented.
      - ./data/images:/app/data/images
      # Local generated TTS audio, temporary until S3/CloudFront is implemented.
      - ./data/audio:/app/data/audio
    expose:
      - "8000"
    ports:
      # Internal port exposed for development; clients should prefer the gateway.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  storage-init:
    image: robotic-assist-child-server
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "mkdir -p /app/data/images /app/data/audio && chmod -R 0777 /app/data/images /app/data/audio"
    volumes:
      - ./data/images:/app/data/images
      - ./data/audio:/app/data/audio
    restart: "no"

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rac
      POSTGRES_PASSWORD: rac
      POSTGRES_DB: rac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rac -d rac"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
