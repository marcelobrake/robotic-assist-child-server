name: robotic-assist-child

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      LOG_LEVEL: INFO
      PROMPTS_REPOSITORY_PATH: /app/prompts
      # Local dev convenience; override / set false for production-like envs.
      DEV_AUTH_DISABLED: "true"
      JWT_SECRET: dev-insecure-secret-change-me
      POSTGRES_DSN: postgresql+psycopg://rac:rac@postgres:5432/rac
      MONGODB_URI: mongodb://mongodb:27017/rac
      MONGODB_DATABASE: rac
      CONVERSATION_PROVIDER: ${CONVERSATION_PROVIDER:-fake}
      CONVERSATION_TEMPERATURE: ${CONVERSATION_TEMPERATURE:-0.4}
      CONVERSATION_MAX_TOKENS: ${CONVERSATION_MAX_TOKENS:-700}
      CONVERSATION_TIMEOUT_SECONDS: ${CONVERSATION_TIMEOUT_SECONDS:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-openai/gpt-5.4-nano}
      OPENROUTER_CHAT_MODEL_FALLBACK: ${OPENROUTER_CHAT_MODEL_FALLBACK:-openai/gpt-5.4-mini}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:8080}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Robotic Assist Child}
      OPENROUTER_FALLBACK_TO_FAKE: ${OPENROUTER_FALLBACK_TO_FAKE:-true}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-fake}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-google/gemini-3.1-flash-image-preview}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/app/data/images}
      PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-http://localhost:8080/v1/images}
      IMAGE_OUTPUT_FORMAT: ${IMAGE_OUTPUT_FORMAT:-png}
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-60}
      IMAGE_MAX_RETRIES: ${IMAGE_MAX_RETRIES:-1}
      IMAGE_FALLBACK_TO_FAKE: ${IMAGE_FALLBACK_TO_FAKE:-true}
      IMAGE_DEFAULT_ASPECT_RATIO: ${IMAGE_DEFAULT_ASPECT_RATIO:-1:1}
      IMAGE_DEFAULT_SIZE: ${IMAGE_DEFAULT_SIZE:-800x800}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      # Prompts repository mounted read-only from the sibling repo.
      - ../robotic-assist-child-prompts:/app/prompts:ro
      # Local generated images, temporary until S3/CloudFront is implemented.
      - ./data/images:/app/data/images
    expose:
      - "8000"
    ports:
      # Internal port exposed for development; clients should prefer the gateway.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rac
      POSTGRES_PASSWORD: rac
      POSTGRES_DB: rac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rac -d rac"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
