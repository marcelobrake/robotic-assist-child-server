worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream rac_server {
        server server:8000;
    }

    # Map for WebSocket upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # Gateway-internal health (unversioned, gateway only).
        location = /gateway/health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # WebSocket sessions proxy.
        location /v1/ws/ {
            proxy_pass http://rac_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Versioned API proxy.
        location /v1/ {
            proxy_pass http://rac_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve tracing and authorization headers.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;

            # CORS (prepared; adjust origins per environment).
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, traceparent, tracestate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}
